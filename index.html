<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중학교 1학년 기술·가정 2학기 내용정리</title>
  <style>
    /* ==========================================================================
       1. 기본 초기화 및 디자인 토큰 (외부 CDN 없이 자체 CSS3 완결 구성)
       ========================================================================== */
    :root {
      --bg-sky: #CBEBFA;
      --bg-sky-deep: #B5E1F7;
      --road-blue: #9AD7F7;
      --road-arrow: #4EB8EE;
      --brand-green: #11A861;
      --brand-green-dark: #0C874D;
      --brand-green-soft: #E6F7EF;
      --text-primary: #1E293B;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --card-white: #FFFFFF;
      --shadow-blob: 0 14px 34px rgba(24, 86, 124, 0.10);
      --shadow-blob-hover: 0 20px 42px rgba(17, 168, 97, 0.18);
      --shadow-modal: 0 24px 60px rgba(15, 23, 42, 0.24);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-sans: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-sans);
      background-color: var(--bg-sky);
      color: var(--text-primary);
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    button:focus-visible {
      outline: 3px solid var(--brand-green);
      outline-offset: 2px;
    }

    /* ==========================================================================
       2. 상단 유틸리티 헤더 바
       ========================================================================== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .top-bar-inner {
      max-width: 1020px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-green);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      letter-spacing: -0.02em;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .btn-pill:active {
      transform: scale(0.97);
    }

    .btn-search {
      background: #F1F5F9;
      color: var(--text-primary);
      border: 1px solid #E2E8F0;
    }

    .btn-search:hover {
      background: #E2E8F0;
    }

    .btn-home-back {
      background: var(--brand-green-soft);
      color: var(--brand-green-dark);
      border: 1px solid rgba(17, 168, 97, 0.25);
    }

    .btn-home-back:hover {
      background: #D1F2E2;
    }

    /* ==========================================================================
       3. 화면 전환 공통 애니메이션
       ========================================================================== */
    .view-section {
      display: none;
      width: 100%;
    }

    .view-section.active {
      display: block;
      animation: viewFadeIn 0.28s ease-out;
    }

    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       4. [홈 화면] 교과서 목차 지도 디자인 (#CBEBFA 배경 + 구불구불한 길 + 3개 블롭 카드)
       ========================================================================== */
    .map-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .map-guide-banner {
      text-align: center;
      margin-bottom: 18px;
    }

    .map-guide-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.85);
      color: #0F4C75;
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(24, 86, 124, 0.08);
    }

    .map-canvas {
      position: relative;
      width: 100%;
      min-height: 980px;
    }

    /* 데스크톱 배경 구불구불한 길 SVG */
    .road-svg-desktop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 단원 블롭 카드 공통 스타일 */
    .unit-blob-card {
      position: absolute;
      z-index: 5;
      background: var(--card-white);
      box-shadow: var(--shadow-blob);
      padding: 30px 32px 28px;
      width: 375px;
      max-width: calc(100vw - 32px);
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease;
      user-select: none;
    }

    .unit-blob-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-blob-hover);
    }

    /* 교과서 원문과 동일한 유기적 둥근 블롭 윤곽 */
    .blob-unit-5 {
      top: 64px;
      right: 36px;
      border-radius: 46% 54% 48% 52% / 44% 46% 54% 56%;
      padding-top: 34px;
    }

    .blob-unit-4 {
      top: 345px;
      left: 34px;
      border-radius: 52% 48% 54% 46% / 46% 52% 48% 54%;
      padding-top: 34px;
    }

    .blob-unit-6 {
      top: 645px;
      right: 48px;
      border-radius: 48% 52% 46% 54% / 50% 44% 56% 50%;
      padding-top: 32px;
    }

    /* 카드 주변 커스텀 일러스트 배치 */
    .illus-woodworker {
      position: absolute;
      top: -64px;
      right: -14px;
      width: 185px;
      height: 118px;
      pointer-events: none;
      z-index: 6;
    }

    .illus-girl-books {
      position: absolute;
      top: -255px;
      left: 24px;
      width: 225px;
      height: 265px;
      pointer-events: none;
      z-index: 6;
    }

    .illus-autonomous-car {
      position: absolute;
      bottom: -24px;
      left: -205px;
      width: 245px;
      height: 185px;
      pointer-events: none;
      z-index: 6;
    }

    .illus-finish-char {
      position: absolute;
      top: -36px;
      right: -68px;
      width: 105px;
      height: 165px;
      pointer-events: none;
      z-index: 6;
    }

    /* 로마 숫자 + 대단원 제목 헤더 */
    .unit-header-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-left: 4px;
    }

    .roman-svg {
      width: 58px;
      height: 62px;
      flex-shrink: 0;
    }

    .unit-title-text {
      font-size: 23px;
      font-weight: 900;
      color: #1E293B;
      line-height: 1.24;
      letter-spacing: -0.03em;
      white-space: pre-line;
    }

    /* 중단원 리스트 (01, 02, 03) */
    .subchapter-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .subchapter-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 12px;
      text-align: left;
      transition: background-color 0.16s ease, transform 0.16s ease;
    }

    .subchapter-btn:hover {
      background-color: var(--brand-green-soft);
      transform: translateX(3px);
    }

    .subchapter-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subchapter-num {
      font-size: 16px;
      font-weight: 900;
      color: var(--brand-green);
      min-width: 24px;
    }

    .subchapter-name {
      font-size: 15px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: -0.02em;
    }

    .subchapter-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .subchapter-page {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .subchapter-arrow {
      font-size: 13px;
      font-weight: 800;
      color: var(--brand-green);
      opacity: 0.75;
    }

    /* ==========================================================================
       5. 반응형 모바일/태블릿 대응 (840px 이하에서 카드 겹침 및 가로 스크롤 방지)
       ========================================================================== */
    @media (max-width: 840px) {
      .road-svg-desktop {
        display: none;
      }

      .map-canvas {
        min-height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
        padding-top: 28px;
      }

      /* 모바일 세로 연결 점선 경로 */
      .map-canvas::before {
        content: '';
        position: absolute;
        top: 60px;
        bottom: 60px;
        left: 50%;
        width: 18px;
        transform: translateX(-50%);
        background: var(--road-blue);
        border-radius: 999px;
        z-index: 1;
      }

      .unit-blob-card {
        position: relative;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        width: 100%;
        max-width: 420px;
        border-radius: 36px !important;
        padding: 28px 22px 24px;
      }

      .blob-unit-4 {
        margin-top: 148px;
      }

      .illus-woodworker {
        top: -54px;
        right: 6px;
        width: 155px;
        height: 100px;
      }

      .illus-girl-books {
        top: -176px;
        left: 50%;
        transform: translateX(-50%);
        width: 165px;
        height: 185px;
      }

      .illus-autonomous-car {
        position: relative;
        bottom: auto;
        left: auto;
        width: 190px;
        height: 130px;
        margin: -10px auto 6px;
        display: block;
      }

      .illus-finish-char {
        top: -32px;
        right: 8px;
        width: 78px;
        height: 120px;
      }
    }

    /* ==========================================================================
       6. [하위 단원 선택 모달] & [검색 모달]
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeBackdrop 0.2s ease-out;
    }

    @keyframes fadeBackdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalPop 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      padding: 20px 22px 16px;
      background: linear-gradient(135deg, #F0FDF7 0%, #E6F6FE 100%);
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-unit-tag {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--brand-green-dark);
      background: #FFFFFF;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(17, 168, 97, 0.25);
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .modal-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #FFFFFF;
      color: var(--text-secondary);
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      flex-shrink: 0;
    }

    .modal-close-btn:hover {
      background: #F1F5F9;
      color: var(--text-primary);
    }

    /* 중단원 선택 탭 바 */
    .subchapter-tabs {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .tab-btn:hover {
      border-color: var(--brand-green);
      color: var(--brand-green-dark);
    }

    .tab-btn.active {
      background: var(--brand-green);
      color: #FFFFFF;
      border-color: var(--brand-green);
      box-shadow: 0 4px 12px rgba(17, 168, 97, 0.25);
    }

    .modal-body {
      padding: 18px 20px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .subchapter-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 4px 4px;
    }

    /* 하위 단원 카드 아이템 */
    .subunit-item-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      text-align: left;
      transition: all 0.16s ease;
    }

    .subunit-item-btn:hover {
      border-color: var(--brand-green);
      background: #F4FCF8;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(17, 168, 97, 0.10);
    }

    .subunit-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subunit-badge {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--brand-green-soft);
      color: var(--brand-green-dark);
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .subunit-item-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .subunit-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-pill-empty {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748B;
      background: #F1F5F9;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .status-pill-ready {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-green-dark);
      background: var(--brand-green-soft);
      padding: 4px 9px;
      border-radius: 999px;
    }

    /* 검색 입력창 */
    .search-input-wrap {
      padding: 16px 20px 8px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 2px solid #CBD5E1;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.16s ease;
    }

    .search-input:focus {
      border-color: var(--brand-green);
    }

    .search-meta-path {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-green-dark);
      margin-bottom: 2px;
    }

    /* ==========================================================================
       7. [소단원 내용정리 화면] 읽기 전용 뷰어 스타일
       ========================================================================== */
    .study-container {
      max-width: 840px;
      margin: 0 auto;
      padding: 24px 16px 72px;
    }

    .breadcrumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .breadcrumb-text {
      font-size: 13px;
      font-weight: 700;
      color: #0F4C75;
      background: rgba(255, 255, 255, 0.78);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .study-header-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 26px 28px;
      box-shadow: var(--shadow-blob);
      margin-bottom: 20px;
      border-top: 6px solid var(--brand-green);
    }

    .study-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag-major {
      font-size: 12.5px;
      font-weight: 800;
      color: #FFFFFF;
      background: var(--brand-green);
      padding: 4px 11px;
      border-radius: 999px;
    }

    .tag-subchapter {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--brand-green-dark);
      background: var(--brand-green-soft);
      padding: 4px 11px;
      border-radius: 999px;
    }

    .study-main-title {
      font-size: 25px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    /* 같은 중단원 내 다른 하위 단원 빠른 전환 바 */
    .sibling-nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px dashed #E2E8F0;
    }

    .sibling-pill {
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      background: #F8FAFC;
      color: var(--text-secondary);
      border: 1px solid #E2E8F0;
      transition: all 0.15s ease;
    }

    .sibling-pill:hover {
      border-color: var(--brand-green);
      color: var(--brand-green-dark);
    }

    .sibling-pill.active {
      background: var(--brand-green-soft);
      color: var(--brand-green-dark);
      border-color: var(--brand-green);
      font-weight: 800;
    }

    /* 학습내용 본문 영역 */
    .study-body-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-shadow: var(--shadow-blob);
      min-height: 280px;
    }

    /* 학습내용이 비어있을 때 표시되는 안내 화면 */
    .empty-study-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 44px 20px;
      border: 2px dashed #CBD5E1;
      border-radius: var(--radius-lg);
      background: #F8FAFC;
    }

    .empty-icon-circle {
      width: 60px;
      height: 60px;
      border-radius: 999px;
      background: var(--brand-green-soft);
      color: var(--brand-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .empty-study-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-study-desc {
      font-size: 14.5px;
      color: var(--text-secondary);
      max-width: 440px;
      margin-bottom: 14px;
    }

    .empty-code-hint {
      font-size: 12.5px;
      color: var(--text-muted);
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      padding: 8px 14px;
      border-radius: 10px;
    }

    /* 추후 학습내용 HTML을 입력했을 때 자동으로 예쁘게 스타일링되는 기본 클래스 */
    .study-rich-content {
      font-size: 16px;
      color: var(--text-primary);

            subchapterId: "6-2",
            num: "02",
            title: "수송 수단과 물류",
            fullTitle: "02. 수송 수단과 물류",
            page: "228",
            subUnits: [
              {
                id: "6-2-1",
                number: "1",
                title: "1. 수송 수단과 물류 체제",
                // ▼▼▼ [학습내용 입력 자리] Ⅵ. 에너지와 수송 > 02. 수송 수단과 물류 > 1. 수송 수단과 물류 체제 ▼▼▼
                content: ``
                // ▲▲▲ [학습내용 입력 끝] ▲▲▲
              },
              {
                id: "6-2-2",
                number: "2",
                title: "2. 수송 수단의 발달 과정",
                // ▼▼▼ [학습내용 입력 자리] Ⅵ. 에너지와 수송 > 02. 수송 수단과 물류 > 2. 수송 수단의 발달 과정 ▼▼▼
                content: ``
                // ▲▲▲ [학습내용 입력 끝] ▲▲▲
              },
              {
                id: "6-2-3",
                number: "3",
                title: "3. 자율 주행 물류 도시 설계하기",
                // ▼▼▼ [학습내용 입력 자리] Ⅵ. 에너지와 수송 > 02. 수송 수단과 물류 > 3. 자율 주행 물류 도시 설계하기 ▼▼▼
                content: ``
                // ▲▲▲ [학습내용 입력 끝] ▲▲▲
              }
            ]
          }
        ]
      }
    ];

    // 전체 22개 번호형 하위 단원을 순차 탐색하기 위한 평탄화 배열 생성
    const FLAT_SUBUNITS = [];
    CURRICULUM_DATA.forEach(function (unit) {
      unit.subchapters.forEach(function (subchapter) {
        subchapter.subUnits.forEach(function (subUnit) {
          FLAT_SUBUNITS.push({
            unit: unit,
            subchapter: subchapter,
            subUnit: subUnit
          });
        });
      });
    });

    // 현재 상태 변수
    let activeModalUnitId = "unit-4";
    let activeModalSubchapterId = "4-1";
    let currentStudySubUnitId = null;

    // DOM 참조 캐싱
    const mapView = document.getElementById("mapView");
    const studyView = document.getElementById("studyView");
    const btnTopBackToMap = document.getElementById("btnTopBackToMap");

    const subUnitModal = document.getElementById("subUnitModal");
    const modalUnitTitle = document.getElementById("modalUnitTitle");
    const modalSubchapterTabs = document.getElementById("modalSubchapterTabs");
    const modalSubchapterHeading = document.getElementById("modalSubchapterHeading");
    const modalSubchapterPage = document.getElementById("modalSubchapterPage");
    const modalSubUnitList = document.getElementById("modalSubUnitList");

    const searchModal = document.getElementById("searchModal");
    const searchInput = document.getElementById("searchInput");
    const searchResultsList = document.getElementById("searchResultsList");

    // HTML 태그를 제외한 순수 텍스트 추출 헬퍼 (검색 필터링용)
    function stripHtmlTags(htmlStr) {
      if (!htmlStr) return "";
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = htmlStr;
      return (tempDiv.textContent || tempDiv.innerText || "").trim();
    }

    // [기능 1] 하위 단원 선택 모달 열기 및 렌더링
    function openSubUnitModal(unitId, subchapterId) {
      const unit = CURRICULUM_DATA.find(function (u) { return u.unitId === unitId; });
      if (!unit) return;

      activeModalUnitId = unit.unitId;
      const targetSubchapter = unit.subchapters.find(function (sc) { return sc.subchapterId === subchapterId; }) || unit.subchapters[0];
      activeModalSubchapterId = targetSubchapter.subchapterId;

      modalUnitTitle.textContent = unit.fullTitle;
      renderModalTabs(unit);
      renderModalSubUnits(unit, targetSubchapter);

      subUnitModal.classList.add("open");
    }

    function closeSubUnitModal() {
      subUnitModal.classList.remove("open");
    }

    function renderModalTabs(unit) {
      modalSubchapterTabs.innerHTML = "";
      unit.subchapters.forEach(function (sc) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab-btn" + (sc.subchapterId === activeModalSubchapterId ? " active" : "");
        btn.textContent = sc.num + ". " + sc.title;
        btn.addEventListener("click", function () {
          activeModalSubchapterId = sc.subchapterId;
          renderModalTabs(unit);
          renderModalSubUnits(unit, sc);
        });
        modalSubchapterTabs.appendChild(btn);
      });
    }

    function renderModalSubUnits(unit, subchapter) {
      modalSubchapterHeading.textContent = subchapter.fullTitle;
      modalSubchapterPage.textContent = "교과서 " + subchapter.page + "쪽 · 총 " + subchapter.subUnits.length + "개 하위 단원";

      modalSubUnitList.innerHTML = "";
      subchapter.subUnits.forEach(function (su) {
        const hasContent = su.content && su.content.trim().length > 0;
        const itemBtn = document.createElement("button");
        itemBtn.type = "button";
        itemBtn.className = "subunit-item-btn";

        itemBtn.innerHTML =
          '<span class="subunit-item-left">' +
            '<span class="subunit-badge">' + su.number + '</span>' +
            '<span class="subunit-item-title">' + su.title + '</span>' +
          '</span>' +
          '<span class="subunit-item-right">' +
            (hasContent
              ? '<span class="status-pill-ready">내용 보기</span>'
              : '<span class="status-pill-empty">내용 준비 중</span>') +
            '<span style="font-weight: 800; color: #11A861;">→</span>' +
          '</span>';

        itemBtn.addEventListener("click", function () {
          closeSubUnitModal();
          openStudyView(su.id);
        });

        modalSubUnitList.appendChild(itemBtn);
      });
    }

    // [기능 2] 하위 단원 내용정리 화면 열기
    function openStudyView(subUnitId) {
      const idx = FLAT_SUBUNITS.findIndex(function (item) { return item.subUnit.id === subUnitId; });
      if (idx === -1) return;

      currentStudySubUnitId = subUnitId;
      const entry = FLAT_SUBUNITS[idx];
      const unit = entry.unit;
      const subchapter = entry.subchapter;
      const subUnit = entry.subUnit;

      // 상단 경로 및 헤더 업데이트
      document.getElementById("studyBreadcrumb").textContent =
        "중1 기술·가정 2학기 › " + unit.fullTitle + " › " + subchapter.fullTitle;
      document.getElementById("studyMajorTag").textContent = unit.fullTitle;
      document.getElementById("studySubchapterTag").textContent =
        subchapter.fullTitle + " · 교과서 " + subchapter.page + "쪽";
      document.getElementById("studyMainTitle").textContent = subUnit.title;

      // 같은 중단원 내 다른 하위 단원 빠른 전환 버튼 렌더링
      const siblingNav = document.getElementById("siblingNav");
      siblingNav.innerHTML = "";
      subchapter.subUnits.forEach(function (sibling) {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "sibling-pill" + (sibling.id === subUnit.id ? " active" : "");
        pill.textContent = sibling.title;
        pill.addEventListener("click", function () {
          openStudyView(sibling.id);
        });
        siblingNav.appendChild(pill);
      });

      // 학습내용 영역 렌더링 (비어 있으면 안내 박스, 채워져 있으면 HTML 본문 표시)
      const studyContentArea = document.getElementById("studyContentArea");
      const trimmedContent = (subUnit.content || "").trim();

      if (trimmedContent.length === 0) {
        studyContentArea.innerHTML =
          '<div class="empty-study-box">' +
            '<div class="empty-icon-circle">' +
              '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>' +
                '<path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>' +
              '</svg>' +
            '</div>' +
            '<p class="empty-study-title">학습 내용이 준비 중입니다.</p>' +
            '<p class="empty-study-desc"><strong>' + subUnit.title + '</strong> 단원의 핵심 개념과 요약 정리가 곧 추가될 예정입니다.</p>' +
            '<span class="empty-code-hint">코드 내 CURRICULUM_DATA의 [' + subUnit.id + '] 학습내용 입력 자리에 내용을 작성하면 자동으로 표시됩니다.</span>' +
          '</div>';
      } else {
        studyContentArea.innerHTML = '<div class="study-rich-content">' + trimmedContent + '</div>';
      }

      // 이전 / 다음 하위 단원 버튼 상태 업데이트 (전체 22개 번호형 하위 단원 기준)
      const btnPrev = document.getElementById("btnPrevSubUnit");
      const btnNext = document.getElementById("btnNextSubUnit");
      const prevTitleEl = document.getElementById("prevSubUnitTitle");
      const nextTitleEl = document.getElementById("nextSubUnitTitle");

      if (idx > 0) {
        const prevEntry = FLAT_SUBUNITS[idx - 1];
        btnPrev.disabled = false;
        prevTitleEl.textContent = prevEntry.subUnit.title;
        btnPrev.onclick = function () {
          openStudyView(prevEntry.subUnit.id);
        };
      } else {
        btnPrev.disabled = true;
        prevTitleEl.textContent = "첫 번째 하위 단원입니다";
        btnPrev.onclick = null;
      }

      if (idx < FLAT_SUBUNITS.length - 1) {
        const nextEntry = FLAT_SUBUNITS[idx + 1];
        btnNext.disabled = false;
        nextTitleEl.textContent = nextEntry.subUnit.title;
        btnNext.onclick = function () {
          openStudyView(nextEntry.subUnit.id);
        };
      } else {
        btnNext.disabled = true;
        nextTitleEl.textContent = "마지막 하위 단원입니다";
        btnNext.onclick = null;
      }

      // 화면 전환
      mapView.classList.remove("active");
      studyView.classList.add("active");
      btnTopBackToMap.style.display = "inline-flex";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showMapView() {
      studyView.classList.remove("active");
      mapView.classList.add("active");
      btnTopBackToMap.style.display = "none";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // [기능 3] 단원·하위단원 검색 모달
    function openSearchModal() {
      searchInput.value = "";
      renderSearchResults("");
      searchModal.classList.add("open");
      setTimeout(function () {
        searchInput.focus();
      }, 60);
    }

    function closeSearchModal() {
      searchModal.classList.remove("open");
    }

    function renderSearchResults(keyword) {
      const query = keyword.trim().toLowerCase();
      searchResultsList.innerHTML = "";

      const matched = FLAT_SUBUNITS.filter(function (entry) {
        if (!query) return true;
        const plainBody = stripHtmlTags(entry.subUnit.content).toLowerCase();
        return (
          entry.unit.fullTitle.toLowerCase().indexOf(query) !== -1 ||
          entry.subchapter.fullTitle.toLowerCase().indexOf(query) !== -1 ||
          entry.subUnit.title.toLowerCase().indexOf(query) !== -1 ||
          entry.subchapter.page.indexOf(query) !== -1 ||
          plainBody.indexOf(query) !== -1
        );
      });

      if (matched.length === 0) {
        searchResultsList.innerHTML =
          '<div style="text-align: center; padding: 36px 16px; color: #64748B; font-size: 14.5px; font-weight: 600;">' +
            '일치하는 단원이나 하위 단원이 없습니다.' +
          '</div>';
        return;
      }

      matched.forEach(function (entry) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "subunit-item-btn";
        btn.innerHTML =
          '<span class="subunit-item-left">' +
            '<span class="subunit-badge">' + entry.unit.roman + '</span>' +
            '<span>' +
              '<span class="search-meta-path">' + entry.unit.fullTitle + ' › ' + entry.subchapter.fullTitle + ' (' + entry.subchapter.page + '쪽)</span>' +
              '<span class="subunit-item-title">' + entry.subUnit.title + '</span>' +
            '</span>' +
          '</span>' +
          '<span style="font-weight: 800; color: #11A861;">→</span>';

        btn.addEventListener("click", function () {
          closeSearchModal();
          openStudyView(entry.subUnit.id);
        });

        searchResultsList.appendChild(btn);
      });
    }

    // 이벤트 바인딩 초기화
    window.addEventListener("DOMContentLoaded", function () {
      // 대단원 블롭 카드 클릭 및 키보드 접근성
      document.querySelectorAll(".unit-blob-card").forEach(function (card) {
        card.addEventListener("click", function () {
          const unitId = card.getAttribute("data-unit-id");
          const subchapterId = card.getAttribute("data-subchapter-id");
          openSubUnitModal(unitId, subchapterId);
        });

        card.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            const unitId = card.getAttribute("data-unit-id");
            const subchapterId = card.getAttribute("data-subchapter-id");
            openSubUnitModal(unitId, subchapterId);
          }
        });
      });

      // 중단원 행(01, 02, 03) 직접 클릭 시 해당 중단원 탭으로 모달 열기
      document.querySelectorAll(".subchapter-btn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          const unitId = btn.getAttribute("data-unit-id");
          const subchapterId = btn.getAttribute("data-subchapter-id");
          openSubUnitModal(unitId, subchapterId);
        });
      });

      // 모달 닫기 및 백드롭 클릭 처리
      document.getElementById("btnCloseSubUnitModal").addEventListener("click", closeSubUnitModal);
      subUnitModal.addEventListener("click", function (e) {
        if (e.target === subUnitModal) closeSubUnitModal();
      });

      document.getElementById("btnOpenSearch").addEventListener("click", openSearchModal);
      document.getElementById("btnCloseSearchModal").addEventListener("click", closeSearchModal);
      searchModal.addEventListener("click", function (e) {
        if (e.target === searchModal) closeSearchModal();
      });

      searchInput.addEventListener("input", function (e) {
        renderSearchResults(e.target.value);
      });

      // ESC 키로 열려있는 모달 닫기
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closeSubUnitModal();
          closeSearchModal();
        }
      });

      // 목차 지도로 돌아가기 버튼들
      btnTopBackToMap.addEventListener("click", showMapView);
      document.getElementById("btnBottomBackToMap").addEventListener("click", showMapView);
    });
  </script>
</body>
</html>
