    function l612RenderQuiz() {
      const container = document.getElementById("l612QuizContainer");
      if (!container) return;
      container.innerHTML = L612_QUIZ_DATA.map(function (q, qIdx) {
        const sel = l612WsState.quizAnswers[qIdx];
        const ok = sel === q.answer;
        const opts = q.options.map(function (opt, oIdx) {
          let extraCls = "";
          if (l612WsState.quizGraded) {
            if (oIdx === q.answer) extraCls = " correct";
            else if (sel === oIdx) extraCls = " wrong";
          } else if (sel === oIdx) {
            extraCls = " selected";
          }
          return '<button type="button" class="l612-quiz-opt-btn' + extraCls + '" onclick="l612SelectQuiz(' + qIdx + ', ' + oIdx + ')">' + (oIdx + 1) + '. ' + opt + '</button>';
        }).join("");

        const exp = l612WsState.quizGraded
          ? '<div style="padding:9px 11px;border-radius:10px;font-size:12px;background:' + (ok ? '#ECFDF5' : '#FFFBEB') + ';color:' + (ok ? '#064E3B' : '#1E293B') + ';"><strong>' + (ok ? '⭕ 정답:' : '💡 해설:') + '</strong> ' + q.explanation + '</div>'
          : "";

        return '<div class="l612-quiz-item">' +
          '<div style="font-size:13.5px;font-weight:800;color:#0F172A;">Q' + (qIdx + 1) + '. ' + q.question + '</div>' +
          '<div class="l612-quiz-opts">' + opts + '</div>' +
          exp +
        '</div>';
      }).join("");
    }

    function l612SelectQuiz(qIdx, oIdx) {
      l612WsState.quizAnswers[qIdx] = oIdx;
      l612WsState.quizGraded = false;
      const banner = document.getElementById("l612QuizResultBanner");
      if (banner) banner.style.display = "none";
      l612RenderQuiz();
      l612WsSaveState();
    }

    function l612GradeQuiz() {
      if (l612WsState.quizAnswers.some(function (v) { return v === null; })) {
        l612ShowToast("모든 문항을 선택한 뒤 채점해 주세요!");
        return;
      }
      l612WsState.quizGraded = true;
      l612RenderQuiz();
      l612WsSaveState();
      const score = l612WsState.quizAnswers.filter(function (a, i) { return a === L612_QUIZ_DATA[i].answer; }).length;
      const banner = document.getElementById("l612QuizResultBanner");
      if (banner) {
        banner.style.display = "inline-block";
        banner.style.background = score >= 4 ? "#D1FAE5" : "#FEF3C7";
        banner.style.color = score >= 4 ? "#065F46" : "#92400E";
        banner.textContent = (score * 20) + "점 (" + score + "/5 정답)";
      }
    }

    function l612ResetQuizOnly() {
      l612WsState.quizAnswers = Array(5).fill(null);
      l612WsState.quizGraded = false;
      const banner = document.getElementById("l612QuizResultBanner");
      if (banner) banner.style.display = "none";
      l612RenderQuiz();
      l612WsSaveState();
    }

    function l612WsUpdateProgress() {
      let pct = 0;
      if (l612WsState.studentId.trim() && l612WsState.studentName.trim()) pct += 5;
      const s1 = l612WsState.step1Answer.trim().length >= 8;
      if (s1) pct += 15;
      const fb = l612WsState.blanks.filter(function (b) { return b && b.trim(); }).length;
      pct += l612WsState.blanksGraded ? 20 : Math.round((fb / 8) * 14);
      const ex = l612WsState.energyExplored.filter(Boolean).length;
      pct += Math.min(20, Math.round((ex / 11) * 20));
      const hasC = l612WsState.villageEnergyType && l612WsState.villageCaseTitle && l612WsState.villageCaseDesc.trim().length >= 8;
      const hasP = l612WsState.villageProposal.trim().length >= 12;
      if (hasC) pct += 15;
      if (hasP) pct += 15;
      const aq = l612WsState.quizAnswers.filter(function (v) { return v !== null; }).length;
      pct += l612WsState.quizGraded ? 10 : Math.round((aq / 5) * 6);
      pct = Math.min(100, pct);

      const bar = document.getElementById("l612ProgressBarFill");
      const pctText = document.getElementById("l612ProgressPercentText");
      const sumComp = document.getElementById("l612SummaryCompletion");
      const sumStudent = document.getElementById("l612SummaryStudentLine");
      const sumS1 = document.getElementById("l612SumStep1");
      const sumS2 = document.getElementById("l612SumStep2");
      const sumS3 = document.getElementById("l612SumStep3");
      const sumS4 = document.getElementById("l612SumStep4");
      const sumQuiz = document.getElementById("l612SummaryQuizScore");
      const badgeS1 = document.getElementById("l612Step1Badge");

      if (bar) bar.style.width = pct + "%";
      if (pctText) pctText.textContent = pct + "%";
      if (sumComp) sumComp.textContent = pct + "%";
      if (sumStudent) {
        sumStudent.textContent = "학습자: " + (l612WsState.studentId || "학번 미입력") + " " + (l612WsState.studentName || "이름 미입력");
      }
      if (sumS1) sumS1.textContent = s1 ? "작성 완료 ✓" : "작성 대기";
      if (badgeS1) badgeS1.textContent = s1 ? "작성 완료 ✓" : "작성 대기";
      if (sumS2) sumS2.textContent = "빈칸 " + fb + "/8 · 탐구 " + ex + "/11";
      if (sumS3) sumS3.textContent = [Boolean(hasC), Boolean(hasP)].filter(Boolean).length + " / 2 활동 완료";

      if (l612WsState.quizGraded) {
        const sc = l612WsState.quizAnswers.filter(function (a, i) { return a === L612_QUIZ_DATA[i].answer; }).length;
        if (sumQuiz) sumQuiz.textContent = (sc * 20) + "점";
        if (sumS4) sumS4.textContent = sc + " / 5문항 정답 ✓";
      } else {
        if (sumQuiz) sumQuiz.textContent = "미응시";
        if (sumS4) sumS4.textContent = aq + " / 5문항 선택";
      }
    }

    function l612OpenResetModal() {
      const modal = document.getElementById("l612ResetConfirmModal");
      if (modal) modal.classList.add("open");
    }

    function l612CloseResetModal() {
      const modal = document.getElementById("l612ResetConfirmModal");
      if (modal) modal.classList.remove("open");
    }

    function l612ConfirmReset() {
      try { localStorage.removeItem(L612_WS_STORAGE_KEY); } catch (e) {}
      l612WsState = {
        activeTab: 1, studentId: "", studentName: "", studyDate: "2026. 11. 15.",
        step1Answer: "", blanks: Array(8).fill(""), blanksGraded: false,
        energyExplored: Array(11).fill(false), energyFilter: "all",
        villageEnergyType: "", villageCaseTitle: "", villageCaseDesc: "",
        villageIconsSelected: ["solar_lamp"], villageProposal: "",
        quizAnswers: Array(5).fill(null), quizGraded: false
      };
      l612WsHydrate();
      l612CloseResetModal();
      l612ShowToast("학습지가 초기화되었습니다.");
    }

    function l612WsHydrate() {
      const sId = document.getElementById("l612StudentId");
      const sName = document.getElementById("l612StudentName");
      const sDate = document.getElementById("l612StudyDate");
      const s1 = document.getElementById("l612Step1Answer");
      const s1Cnt = document.getElementById("l612Step1CharCount");
      const vType = document.getElementById("l612VillageEnergyType");
      const vTitle = document.getElementById("l612VillageCaseTitle");
      const vDesc = document.getElementById("l612VillageCaseDesc");
      const vProp = document.getElementById("l612VillageProposalInput");
      const vPropCnt = document.getElementById("l612ProposalCharCount");

      if (sId) sId.value = l612WsState.studentId;
      if (sName) sName.value = l612WsState.studentName;
      if (sDate) sDate.value = l612WsState.studyDate;
      if (s1) s1.value = l612WsState.step1Answer;
      if (s1Cnt) s1Cnt.textContent = l612WsState.step1Answer.length + "자 작성";

      l612BindBlanks();
      l612RenderWordBank();
      if (l612WsState.blanksGraded) l612GradeBlanks();
      else l612ResetBlankStyles();

      l612FilterEnergyCards(l612WsState.energyFilter || "all");
      if (vType) vType.value = l612WsState.villageEnergyType;
      if (vTitle) vTitle.value = l612WsState.villageCaseTitle;
      if (vDesc) vDesc.value = l612WsState.villageCaseDesc;
      if (vProp) vProp.value = l612WsState.villageProposal;
      if (vPropCnt) vPropCnt.textContent = l612WsState.villageProposal.length + "자 작성";

      l612RenderVillageIcons();
      l612RenderQuiz();
      l612WsSwitchTab(l612WsState.activeTab || 1);
      l612WsUpdateProgress();
    }

    function initLesson612Module() {
      l612CleanupMedia();
      l612CurrentTime = 0;
      l612CurrentSceneIdx = -1;
      l612ActiveSegIdx = -1;
      l612IsPlaying = true;
      l612LastFrameTime = performance.now();

      l612ResizeCanvas();
      l612InitParticles();
      l612SyncPlayBtn();
      l612UpdateTtsUI();
      l612UpdateTimeUI(0);

      l612WsLoadState();
      l612WsHydrate();
      l612SwitchMainApp("motion");

      l612RafId = requestAnimationFrame(l612AnimationLoop);
    }

    window.addEventListener("resize", function () {
      if (currentStudySubUnitId === "6-1-2") {
        l612ResizeCanvas();
      }
    });

    // 이벤트 바인딩 초기화
    window.addEventListener("DOMContentLoaded", function () {
      // 대단원 블롭 카드 클릭 및 키보드 접근성
      document.querySelectorAll(".unit-blob-card").forEach(function (card) {
        card.addEventListener("click", function () {
          const unitId = card.getAttribute("data-unit-id");
          const subchapterId = card.getAttribute("data-subchapter-id");
          openSubUnitModal(unitId, subchapterId);
        });

        card.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            const unitId = card.getAttribute("data-unit-id");
            const subchapterId = card.getAttribute("data-subchapter-id");
            openSubUnitModal(unitId, subchapterId);
          }
        });
      });

      // 중단원 행(01, 02, 03) 직접 클릭 시 해당 중단원 탭으로 모달 열기
      document.querySelectorAll(".subchapter-btn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          const unitId = btn.getAttribute("data-unit-id");
          const subchapterId = btn.getAttribute("data-subchapter-id");
          openSubUnitModal(unitId, subchapterId);
        });
      });

      // 모달 닫기 및 백드롭 클릭 처리
      document.getElementById("btnCloseSubUnitModal").addEventListener("click", closeSubUnitModal);
      subUnitModal.addEventListener("click", function (e) {
        if (e.target === subUnitModal) closeSubUnitModal();
      });

      document.getElementById("btnOpenSearch").addEventListener("click", openSearchModal);
      document.getElementById("btnCloseSearchModal").addEventListener("click", closeSearchModal);
      searchModal.addEventListener("click", function (e) {
        if (e.target === searchModal) closeSearchModal();
      });

      searchInput.addEventListener("input", function (e) {
        renderSearchResults(e.target.value);
      });

      // ESC 키로 열려있는 모달 닫기
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closeSubUnitModal();
          closeSearchModal();
          l612CloseReportPreview();
          l612CloseResetModal();
        }
      });

      // 목차 지도로 돌아가기 버튼들
      btnTopBackToMap.addEventListener("click", showMapView);
      document.getElementById("btnBottomBackToMap").addEventListener("click", showMapView);
    });
  </script>
</body>
</html>
