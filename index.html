<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중학교 1학년 기술·가정 2학기 내용정리</title>
  <style>
    /* ==========================================================================
       1. 기본 초기화 및 디자인 토큰 (외부 CDN 없이 자체 CSS3 완결 구성)
       ========================================================================== */
    :root {
      --bg-sky: #CBEBFA;
      --bg-sky-deep: #B5E1F7;
      --road-blue: #9AD7F7;
      --road-arrow: #4EB8EE;
      --brand-green: #11A861;
      --brand-green-dark: #0C874D;
      --brand-green-soft: #E6F7EF;
      --text-primary: #1E293B;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --card-white: #FFFFFF;
      --shadow-blob: 0 14px 34px rgba(24, 86, 124, 0.10);
      --shadow-blob-hover: 0 20px 42px rgba(17, 168, 97, 0.18);
      --shadow-modal: 0 24px 60px rgba(15, 23, 42, 0.24);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font-sans: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-sans);
      background-color: var(--bg-sky);
      color: var(--text-primary);
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    button:focus-visible {
      outline: 3px solid var(--brand-green);
      outline-offset: 2px;
    }

    /* ==========================================================================
       2. 상단 유틸리티 헤더 바
       ========================================================================== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .top-bar-inner {
      max-width: 1020px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-green);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      letter-spacing: -0.02em;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .btn-pill:active {
      transform: scale(0.97);
    }

    .btn-search {
      background: #F1F5F9;
      color: var(--text-primary);
      border: 1px solid #E2E8F0;
    }

    .btn-search:hover {
      background: #E2E8F0;
    }

    .btn-home-back {
      background: var(--brand-green-soft);
      color: var(--brand-green-dark);
      border: 1px solid rgba(17, 168, 97, 0.25);
    }

    .btn-home-back:hover {
      background: #D1F2E2;
    }

    /* ==========================================================================
       3. 화면 전환 공통 애니메이션
       ========================================================================== */
    .view-section {
      display: none;
      width: 100%;
    }

    .view-section.active {
      display: block;
      animation: viewFadeIn 0.28s ease-out;
    }

    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       4. [홈 화면] 교과서 목차 지도 디자인 (#CBEBFA 배경 + 구불구불한 길 + 3개 블롭 카드)
       ========================================================================== */
    .map-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .map-guide-banner {
      text-align: center;
      margin-bottom: 18px;
    }

    .map-guide-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.85);
      color: #0F4C75;
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(24, 86, 124, 0.08);
    }

    .map-canvas {
      position: relative;
      width: 100%;
      min-height: 980px;
    }

    /* 데스크톱 배경 구불구불한 길 SVG */
    .road-svg-desktop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 단원 블롭 카드 공통 스타일 */
    .unit-blob-card {
      position: absolute;
      z-index: 5;
      background: var(--card-white);
      box-shadow: var(--shadow-blob);
      padding: 30px 32px 28px;
      width: 375px;
      max-width: calc(100vw - 32px);
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease;
      user-select: none;
    }

    .unit-blob-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-blob-hover);
    }

    /* 교과서 원문과 동일한 유기적 둥근 블롭 윤곽 */
    .blob-unit-5 {
      top: 64px;
      right: 36px;
      border-radius: 46% 54% 48% 52% / 44% 46% 54% 56%;
      padding-top: 34px;
    }

    .blob-unit-4 {
      top: 345px;
      left: 34px;
      border-radius: 52% 48% 54% 46% / 46% 52% 48% 54%;
      padding-top: 34px;
    }

    .blob-unit-6 {
      top: 645px;
      right: 48px;
      border-radius: 48% 52% 46% 54% / 50% 44% 56% 50%;
      padding-top: 32px;
    }

    /* 카드 주변 커스텀 일러스트 배치 */
    .illus-woodworker {
      position: absolute;
      top: -64px;
      right: -14px;
      width: 185px;
      height: 118px;
      pointer-events: none;
      z-index: 6;
    }

    .illus-girl-books {
      position: absolute;
      top: -255px;
      left: 24px;
      width: 225px;
      height: 265px;
      pointer-events: none;
      z-index: 6;
    }

    .illus-autonomous-car {
      position: absolute;
      bottom: -24px;
      left: -205px;
      width: 245px;
      height: 185px;
      pointer-events: none;
      z-index: 6;
    }

    .illus-finish-char {
      position: absolute;
      top: -36px;
      right: -68px;
      width: 105px;
      height: 165px;
      pointer-events: none;
      z-index: 6;
    }

    /* 로마 숫자 + 대단원 제목 헤더 */
    .unit-header-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-left: 4px;
    }

    .roman-svg {
      width: 58px;
      height: 62px;
      flex-shrink: 0;
    }

    .unit-title-text {
      font-size: 23px;
      font-weight: 900;
      color: #1E293B;
      line-height: 1.24;
      letter-spacing: -0.03em;
      white-space: pre-line;
    }

    /* 중단원 리스트 (01, 02, 03) */
    .subchapter-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .subchapter-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 12px;
      text-align: left;
      transition: background-color 0.16s ease, transform 0.16s ease;
    }

    .subchapter-btn:hover {
      background-color: var(--brand-green-soft);
      transform: translateX(3px);
    }

    .subchapter-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subchapter-num {
      font-size: 16px;
      font-weight: 900;
      color: var(--brand-green);
      min-width: 24px;
    }

    .subchapter-name {
      font-size: 15px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: -0.02em;
    }

    .subchapter-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .subchapter-page {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .subchapter-arrow {
      font-size: 13px;
      font-weight: 800;
      color: var(--brand-green);
      opacity: 0.75;
    }

    /* ==========================================================================
       5. 반응형 모바일/태블릿 대응 (840px 이하에서 카드 겹침 및 가로 스크롤 방지)
       ========================================================================== */
    @media (max-width: 840px) {
      .road-svg-desktop {
        display: none;
      }

      .map-canvas {
        min-height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
        padding-top: 28px;
      }

      /* 모바일 세로 연결 점선 경로 */
      .map-canvas::before {
        content: '';
        position: absolute;
        top: 60px;
        bottom: 60px;
        left: 50%;
        width: 18px;
        transform: translateX(-50%);
        background: var(--road-blue);
        border-radius: 999px;
        z-index: 1;
      }

      .unit-blob-card {
        position: relative;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        width: 100%;
        max-width: 420px;
        border-radius: 36px !important;
        padding: 28px 22px 24px;
      }

      .blob-unit-4 {
        margin-top: 148px;
      }

      .illus-woodworker {
        top: -54px;
        right: 6px;
        width: 155px;
        height: 100px;
      }

      .illus-girl-books {
        top: -176px;
        left: 50%;
        transform: translateX(-50%);
        width: 165px;
        height: 185px;
      }

      .illus-autonomous-car {
        position: relative;
        bottom: auto;
        left: auto;
        width: 190px;
        height: 130px;
        margin: -10px auto 6px;
        display: block;
      }

      .illus-finish-char {
        top: -32px;
        right: 8px;
        width: 78px;
        height: 120px;
      }
    }

    /* ==========================================================================
       6. [하위 단원 선택 모달] & [검색 모달]
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeBackdrop 0.2s ease-out;
    }

    @keyframes fadeBackdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalPop 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      padding: 20px 22px 16px;
      background: linear-gradient(135deg, #F0FDF7 0%, #E6F6FE 100%);
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-unit-tag {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--brand-green-dark);
      background: #FFFFFF;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(17, 168, 97, 0.25);
      margin-bottom: 6px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .modal-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #FFFFFF;
      color: var(--text-secondary);
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      flex-shrink: 0;
    }

    .modal-close-btn:hover {
      background: #F1F5F9;
      color: var(--text-primary);
    }

    /* 중단원 선택 탭 바 */
    .subchapter-tabs {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .tab-btn:hover {
      border-color: var(--brand-green);
      color: var(--brand-green-dark);
    }

    .tab-btn.active {
      background: var(--brand-green);
      color: #FFFFFF;
      border-color: var(--brand-green);
      box-shadow: 0 4px 12px rgba(17, 168, 97, 0.25);
    }

    .modal-body {
      padding: 18px 20px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .subchapter-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 4px 4px;
    }

    /* 하위 단원 카드 아이템 */
    .subunit-item-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      text-align: left;
      transition: all 0.16s ease;
    }

    .subunit-item-btn:hover {
      border-color: var(--brand-green);
      background: #F4FCF8;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(17, 168, 97, 0.10);
    }

    .subunit-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subunit-badge {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--brand-green-soft);
      color: var(--brand-green-dark);
      font-size: 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .subunit-item-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .subunit-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-pill-empty {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748B;
      background: #F1F5F9;
      padding: 4px 9px;
      border-radius: 999px;
    }

    .status-pill-ready {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-green-dark);
      background: var(--brand-green-soft);
      padding: 4px 9px;
      border-radius: 999px;
    }

    /* 검색 입력창 */
    .search-input-wrap {
      padding: 16px 20px 8px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 2px solid #CBD5E1;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.16s ease;
    }

    .search-input:focus {
      border-color: var(--brand-green);
    }

    .search-meta-path {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-green-dark);
      margin-bottom: 2px;
    }

    /* ==========================================================================
       7. [소단원 내용정리 화면] 읽기 전용 뷰어 스타일
       ========================================================================== */
    .study-container {
      max-width: 840px;
      margin: 0 auto;
      padding: 24px 16px 72px;
      transition: max-width 0.25s ease;
    }

    .study-container.wide-lesson {
      max-width: 1120px;
    }

    .breadcrumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .breadcrumb-text {
      font-size: 13px;
      font-weight: 700;
      color: #0F4C75;
      background: rgba(255, 255, 255, 0.78);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .study-header-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 26px 28px;
      box-shadow: var(--shadow-blob);
      margin-bottom: 20px;
      border-top: 6px solid var(--brand-green);
    }

    .study-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag-major {
      font-size: 12.5px;
      font-weight: 800;
      color: #FFFFFF;
      background: var(--brand-green);
      padding: 4px 11px;
      border-radius: 999px;
    }

    .tag-subchapter {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--brand-green-dark);
      background: var(--brand-green-soft);
      padding: 4px 11px;
      border-radius: 999px;
    }

    .study-main-title {
      font-size: 25px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    /* 같은 중단원 내 다른 하위 단원 빠른 전환 바 */
    .sibling-nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px dashed #E2E8F0;
    }

    .sibling-pill {
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      background: #F8FAFC;
      color: var(--text-secondary);
      border: 1px solid #E2E8F0;
      transition: all 0.15s ease;
    }

    .sibling-pill:hover {
      border-color: var(--brand-green);
      color: var(--brand-green-dark);
    }

    .sibling-pill.active {
      background: var(--brand-green-soft);
      color: var(--brand-green-dark);
      border-color: var(--brand-green);
      font-weight: 800;
    }

    /* 학습내용 본문 영역 */
    .study-body-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-shadow: var(--shadow-blob);
      min-height: 280px;
    }

    .study-body-card.interactive-lesson-shell {
      padding: 0;
      overflow: hidden;
      background: #F8FAFC;
    }

    /* 학습내용이 비어있을 때 표시되는 안내 화면 */
    .empty-study-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 44px 20px;
      border: 2px dashed #CBD5E1;
      border-radius: var(--radius-lg);
      background: #F8FAFC;
    }

    .empty-icon-circle {
      width: 60px;
      height: 60px;
      border-radius: 999px;
      background: var(--brand-green-soft);
      color: var(--brand-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .empty-study-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-study-desc {
      font-size: 14.5px;
      color: var(--text-secondary);
      max-width: 440px;
      margin-bottom: 14px;
    }

    .empty-code-hint {
      font-size: 12.5px;
      color: var(--text-muted);
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      padding: 8px 14px;
      border-radius: 10px;
    }

    /* 추후 학습내용 HTML을 입력했을 때 자동으로 예쁘게 스타일링되는 기본 클래스 */
    .study-rich-content {
      font-size: 16px;
      color: var(--text-primary);
      line-height: 1.75;
    }

    .study-rich-content h3 {
      font-size: 19px;
      font-weight: 800;
      color: var(--brand-green-dark);
      margin: 22px 0 10px;
      padding-left: 12px;
      border-left: 4px solid var(--brand-green);
    }

    .study-rich-content h3:first-child {
      margin-top: 0;
    }

    .study-rich-content p {
      margin-bottom: 12px;
    }

    .study-rich-content ul, .study-rich-content ol {
      padding-left: 22px;
      margin-bottom: 14px;
    }

    .study-rich-content li {
      margin-bottom: 6px;
    }

    .study-rich-content .concept-box {
      background: #F4FCF8;
      border: 1px solid #BCEAD3;
      border-radius: 16px;
      padding: 18px 20px;
      margin: 14px 0;
    }

    .study-rich-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14.5px;
    }

    .study-rich-content th, .study-rich-content td {
      border: 1px solid #CBD5E1;
      padding: 10px 12px;
      text-align: left;
    }

    .study-rich-content th {
      background: #F1F5F9;
      font-weight: 800;
    }

    /* 하단 이전/목록/다음 이동 내비게이션 */
    .bottom-seq-nav {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: stretch;
    }

    .seq-btn {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 6px 18px rgba(24, 86, 124, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .seq-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(17, 168, 97, 0.14);
    }

    .seq-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .seq-btn-prev {
      text-align: left;
    }

    .seq-btn-next {
      text-align: right;
    }

    .seq-btn-map {
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-green-dark);
      background: #F0FDF7;
      border: 1px solid rgba(17, 168, 97, 0.25);
      padding: 14px 18px;
    }

    .seq-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-green);
      margin-bottom: 3px;
    }

    .seq-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (max-width: 600px) {
      .study-header-card, .study-body-card {
        padding: 22px 18px;
      }

      .study-main-title {
        font-size: 21px;
      }

      .bottom-seq-nav {
        grid-template-columns: 1fr;
      }

      .seq-btn-next {
        text-align: left;
      }
    }

    /* ==========================================================================
       8. [6-1-2 친환경 에너지의 활용] 자체 완결형 인터랙티브 수업 패키지 스타일
       ========================================================================== */
    .l612-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      color: #1E293B;
      background: #F8FAFC;
    }

    /* 상단 노션 통합 허브 바 */
    .l612-hub-bar {
      background: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .l612-hub-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .l612-notion-badge {
      padding: 3px 8px;
      border-radius: 6px;
      background: #0F172A;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .l612-hub-subtitle {
      font-size: 13.5px;
      font-weight: 800;
      color: #1E293B;
    }

    .l612-hub-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: #F1F5F9;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
    }

    .l612-hub-tab-btn {
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: #475569;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    .l612-hub-tab-btn:hover {
      background: #FFFFFF;
      color: #0F172A;
    }

    .l612-hub-tab-btn.active {
      background: #0F172A;
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
    }

    /* --------------------------------------------------------------------------
       8-1. VIEW 1: 교육용 모션 그래픽 스테이지
       -------------------------------------------------------------------------- */
    .l612-motion-wrap {
      background: #080C14;
      color: #F1F5F9;
      padding: 16px;
    }

    .l612-player-box {
      width: 100%;
      border-radius: 22px;
      border: 1px solid #1E293B;
      background: #020617;
      overflow: hidden;
      box-shadow: 0 20px 44px rgba(2, 6, 23, 0.55);
      display: flex;
      flex-direction: column;
    }

    .l612-player-box:fullscreen {
      border-radius: 0;
      max-height: 100vh;
    }

    .l612-player-topbar {
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid #1E293B;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .l612-scene-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .l612-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #34D399;
      animation: l612PulseDot 1.6s infinite;
    }

    @keyframes l612PulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .l612-scene-badge-text {
      font-size: 12px;
      font-weight: 800;
      color: #6EE7B7;
    }

    .l612-audio-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .l612-tts-group {
      display: inline-flex;
      align-items: center;
      border-radius: 10px;
      background: #1E293B;
      border: 1px solid #334155;
      overflow: hidden;
    }

    .l612-tts-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      color: #E2E8F0;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .l612-tts-btn:hover {
      background: #334155;
    }

    .l612-tts-btn.active {
      background: #10B981;
      color: #020617;
    }

    .l612-voice-select {
      background: #020617;
      color: #6EE7B7;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 8px;
      border: none;
      border-left: 1px solid #334155;
      font-family: inherit;
      cursor: pointer;
    }

    .l612-ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #334155;
      transition: background 0.16s ease;
    }

    .l612-ctrl-btn:hover {
      background: #334155;
    }

    .l612-ctrl-btn.speed {
      color: #6EE7B7;
      font-weight: 800;
    }

    /* 모션 스테이지 뷰포트 */
    .l612-motion-stage {
      position: relative;
      width: 100%;
      min-height: 490px;
      background: radial-gradient(circle at 50% 35%, #0F2E2A 0%, #0A1826 65%, #050911 100%);
      overflow: hidden;
      transition: background 1.1s ease;
      user-select: none;
    }

    .l612-motion-stage.theme-sky {
      background: radial-gradient(circle at 50% 35%, #0E2942 0%, #0A1526 65%, #050911 100%);
    }

    .l612-motion-stage.theme-balance {
      background: radial-gradient(circle at 50% 35%, #162B2B 0%, #121829 65%, #050911 100%);
    }

    .l612-particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .l612-stage-hud {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .l612-unmute-banner {
      padding: 5px 12px;
      border-radius: 999px;
      background: #FBBF24;
      color: #020617;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(251, 191, 36, 0.35);
      animation: l612BounceHint 1.8s infinite;
    }

    .l612-unmute-banner:hover {
      background: #FCD34D;
    }

    @keyframes l612BounceHint {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .l612-timecode-pill {
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      color: #CBD5E1;
    }

    .l612-scene-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.97) translateY(10px);
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 46px 20px 84px;
    }

    .l612-scene-layer.is-active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
      z-index: 10;
    }

    .l612-stagger {
      opacity: 0;
      transform: translateY(16px) scale(0.97);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .l612-scene-layer.is-active .l612-stagger {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .l612-d1 { transition-delay: 0.08s !important; }
    .l612-d2 { transition-delay: 0.22s !important; }
    .l612-d3 { transition-delay: 0.36s !important; }
    .l612-d4 { transition-delay: 0.50s !important; }
    .l612-d5 { transition-delay: 0.64s !important; }

    .l612-scene-inner {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .l612-s1-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 22px;
      align-items: center;
    }

    .l612-tag-emerald {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #6EE7B7;
      font-size: 12px;
      font-weight: 800;
    }

    .l612-tag-sky {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7DD3FC;
      font-size: 12px;
      font-weight: 800;
    }

    .l612-tag-amber {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #FCD34D;
      font-size: 12px;
      font-weight: 800;
    }

    .l612-hero-title {
      font-size: 30px;
      font-weight: 900;
      line-height: 1.25;
      color: #FFFFFF;
      margin: 10px 0;
    }

    .l612-gradient-text {
      background: linear-gradient(90deg, #6EE7B7, #5EEAD4, #7DD3FC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .l612-hero-desc {
      font-size: 13.5px;
      color: #CBD5E1;
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .l612-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .l612-mini-chip {
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .l612-glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
    }

    .l612-s1-illus-box {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 26px;
    }

    @keyframes l612SpinBlades {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .l612-turbine-blades {
      animation: l612SpinBlades 5s linear infinite;
    }

    @keyframes l612FloatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .l612-float-slow {
      animation: l612FloatSlow 3.2s ease-in-out infinite;
    }

    @keyframes l612PulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.4)); }
      50% { filter: drop-shadow(0 0 15px rgba(52, 211, 153, 0.9)); }
    }
    .l612-glow-pulse {
      animation: l612PulseGlow 2.4s ease-in-out infinite;
    }

    .l612-scene-heading {
      font-size: 24px;
      font-weight: 900;
      color: #FFFFFF;
      margin-top: 6px;
    }

    .l612-grid-8 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .l612-card-8 {
      padding: 12px;
      border-top-width: 3px;
      border-top-style: solid;
    }

    .l612-card-8-title {
      font-size: 13px;
      font-weight: 800;
      margin-top: 4px;
    }

    .l612-card-8-desc {
      font-size: 11.5px;
      color: #CBD5E1;
      margin-top: 3px;
      line-height: 1.45;
    }

    .l612-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .l612-card-3 {
      padding: 18px;
      border-top-width: 4px;
      border-top-style: solid;
    }

    .l612-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .l612-card-2 {
      padding: 18px;
      border-left-width: 4px;
      border-left-style: solid;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .l612-compare-pill {
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.55;
    }

    .l612-s5-cta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    .l612-s5-btn-green {
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      background: #10B981;
      color: #020617;
    }

    .l612-s5-btn-amber {
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      background: #FCD34D;
      color: #020617;
    }

    /* 하단 자막 바 */
    .l612-subtitle-wrap {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      justify-content: center;
    }

    .l612-subtitle-pill {
      background: rgba(10, 17, 30, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
      padding: 9px 14px;
      border-radius: 16px;
      max-width: 780px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .l612-subtitle-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .l612-wave-box {
      display: none;
      align-items: center;
      gap: 2px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.35);
      flex-shrink: 0;
    }

    .l612-wave-box.speaking {
      display: inline-flex;
    }

    @keyframes l612VoiceWave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }

    .l612-voice-bar {
      width: 3px;
      height: 12px;
      border-radius: 999px;
      background-color: #34D399;
      animation: l612VoiceWave 0.75s ease-in-out infinite;
    }
    .l612-voice-bar:nth-child(2) { animation-delay: 0.15s; }
    .l612-voice-bar:nth-child(3) { animation-delay: 0.30s; }

    .l612-subtitle-text {
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.45;
    }

    .l612-quick-tts-btn {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.2);
      color: #6EE7B7;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    .l612-quick-tts-btn.active {
      background: #10B981;
      color: #020617;
    }

    /* 하단 타임라인 스크러버 */
    .l612-timeline-footer {
      background: #020617;
      border-top: 1px solid #1E293B;
      padding: 10px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .l612-timeline-track {
      width: 100%;
      height: 8px;
      background: #1E293B;
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }

    .l612-timeline-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #34D399, #2DD4BF, #38BDF8);
      border-radius: 999px;
    }

    .l612-transport-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .l612-transport-left, .l612-chapter-pills {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .l612-play-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      background: #10B981;
      color: #020617;
    }

    .l612-chap-btn {
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(30, 41, 59, 0.85);
      color: #94A3B8;
    }

    .l612-chap-btn:hover {
      color: #FFFFFF;
    }

    .l612-chap-btn.active {
      background: #10B981;
      color: #020617;
      font-weight: 800;
    }

    /* --------------------------------------------------------------------------
       8-2. VIEW 2: 한 장 핵심 정리 인포그래픽 뷰어
       -------------------------------------------------------------------------- */
    .l612-ig-wrap {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .l612-ig-toolbar {
      background: #FFFFFF;
      border-radius: 18px;
      border: 1px solid #E2E8F0;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .l612-ig-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .l612-zoom-group {
      display: inline-flex;
      background: #F1F5F9;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
    }

    .l612-zoom-btn {
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }

    .l612-zoom-btn.active {
      background: #FFFFFF;
      color: #0F172A;

    .l612-png-btn {
      padding: 8px 14px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 800;
      background: #059669;
      color: #FFFFFF;

      padding: 16px;

      display: flex;
      justify-content: center;

    .l612-ig-svg-holder {
      width: 100%;
      max-width: 880px;

    .l612-ws-wrap {
      display: flex;
      flex-direction: column;
    }

    .l612-ws-header {
      background: #FFFFFF;
      border-bottom: 1px solid #E2E8F0;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .l612-ws-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .l612-student-fields {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .l612-meta-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #FAF9F5;
      border: 1px solid #E2E8F0;
      border-radius: 9px;
      padding: 5px 9px;
      font-size: 12px;
    }

    .l612-meta-label span {
      font-weight: 800;
      color: #475569;
    }

    .l612-meta-label input {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: #1E293B;
      outline: none;
    }

    .l612-ws-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .l612-progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      font-size: 12px;
      font-weight: 800;
      color: #065F46;
    }

    .l612-progress-track {
      width: 68px;
      height: 8px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }

    .l612-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10B981, #0EA5E9);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .l612-ws-step-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .l612-step-tab-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 11px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      border: 2px solid #E2E8F0;
      background: #F8FAFC;
      color: #475569;
      text-align: left;
      transition: all 0.16s ease;
    }

    .l612-step-tab-btn.active {
      background: #ECFDF5;
      border-color: #059669;
      color: #064E3B;
      font-weight: 800;
    }

    .l612-step-num-dot {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #E2E8F0;
      color: #475569;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .l612-step-tab-btn.active .l612-step-num-dot {
      background: #059669;
      color: #FFFFFF;
    }

    .l612-ws-body {
      padding: 18px;
    }

    .l612-ws-panel {
      display: none;
    }

    .l612-ws-panel.active {
      display: block;
      animation: viewFadeIn 0.24s ease-out;
    }

    .l612-ws-card {
      background: #FFFFFF;
      border-radius: 22px;
      border: 1px solid #E2E8F0;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .l612-ws-card-head {
      padding: 13px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #FFFFFF;
    }

    .l612-ws-card-head h3 {
      font-size: 15px;
      font-weight: 800;
    }

    .l612-ws-card-content {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .l612-col-5 { grid-column: span 5; }
    .l612-col-6 { grid-column: span 6; }
    .l612-col-7 { grid-column: span 7; }
    .l612-col-8 { grid-column: span 8; }
    .l612-col-4 { grid-column: span 4; }

    .l612-cream-box {
      background: #FAF9F5;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 15px;
    }

    .l612-daily-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .l612-daily-card {
      text-align: left;
      padding: 11px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .l612-daily-card:hover {
      border-color: #34D399;
    }

    .l612-daily-card.selected {
      background: #ECFDF5;
      border-color: #10B981;
    }

    .l612-insight-box {
      background: #F0F9FF;
      border: 1px solid #BAE6FD;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12.5px;
      color: #334155;
      line-height: 1.55;
    }

    .l612-prompt-banner {
      background: #ECFDF5;
      border-left: 4px solid #059669;
      border-radius: 0 12px 12px 0;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 800;
      color: #0F172A;
    }

    .l612-kw-chip {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #F0F9FF;
      color: #0369A1;
      border: 1px solid #BAE6FD;
    }

    .l612-kw-chip:hover {
      background: #E0F2FE;
    }

    .l612-textarea {
      width: 100%;
      border-radius: 14px;
      border: 1.5px solid #CBD5E1;
      background: #FAF9F5;
      padding: 11px 13px;
      font-family: inherit;
      font-size: 13.5px;
      color: #1E293B;
      line-height: 1.65;
      resize: vertical;
    }

    .l612-textarea:focus {
      outline: none;
      background: #FFFFFF;
      border-color: #10B981;
    }

    .l612-lined-paper {
      background-image: repeating-linear-gradient(transparent, transparent 29px, #CBD5E1 29px, #CBD5E1 30px);
      line-height: 30px;
      padding-top: 3px;
    }

    .l612-blank-input {
      width: 96px;
      margin: 0 2px;
      padding: 2px 6px;
      text-align: center;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      color: #065F46;
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 8px;
      transition: all 0.16s ease;
    }

    .l612-blank-input.blank-active {
      border-color: #059669;
      background: #ECFDF5;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
    }

    .l612-blank-input.correct {
      border-color: #10B981;
      background: #ECFDF5;
      color: #065F46;
    }

    .l612-blank-input.wrong {
      border-color: #F43F5E;
      background: #FFF1F2;
      color: #9F1239;
    }

    .l612-word-chip {
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      background: #FFFFFF;
      color: #1E293B;
      border: 1px solid #CBD5E1;
    }

    .l612-word-chip:hover {
      border-color: #10B981;
    }

    .l612-word-chip.used {
      background: #E2E8F0;
      color: #94A3B8;
      text-decoration: line-through;
    }

    .l612-energy-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 290px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .l612-energy-item-btn {
      text-align: left;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #E2E8F0;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .l612-energy-item-btn.done {
      border-color: #34D399;
      background: #F0FDF4;
    }

    .l612-ws-card-foot {
      padding: 12px 18px;
      background: #F8FAFC;
      border-top: 1px solid #E2E8F0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .l612-btn-primary {
      padding: 8px 15px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 800;
      background: #059669;
      color: #FFFFFF;
    }

    .l612-btn-primary:hover {
      background: #047857;
    }

    .l612-btn-secondary {
      padding: 7px 13px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 700;
      background: #FFFFFF;
      color: #334155;
      border: 1px solid #CBD5E1;
    }

    .l612-btn-secondary:hover {
      background: #F1F5F9;
    }

    .l612-quiz-item {
      border-radius: 16px;
      border: 1px solid #E2E8F0;
      background: rgba(250, 249, 245, 0.65);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .l612-quiz-opts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .l612-quiz-opt-btn {
      padding: 9px 11px;
      border-radius: 11px;
      border: 2px solid #E2E8F0;
      background: #FFFFFF;
      color: #1E293B;
      text-align: left;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .l612-quiz-opt-btn.selected {
      border-color: #059669;
      background: #ECFDF5;
      color: #064E3B;
      font-weight: 700;
    }

    .l612-quiz-opt-btn.correct {
      border-color: #10B981;
      background: #ECFDF5;
      color: #065F46;
      font-weight: 800;
    }

    .l612-quiz-opt-btn.wrong {
      border-color: #F43F5E;
      background: #FFF1F2;
      color: #9F1239;
      font-weight: 800;
    }

    /* 학습지 내부 모달 & 토스트 */
    .l612-submodal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .l612-submodal-backdrop.open {
      display: flex;
    }

    .l612-submodal-card {
      background: #FFFFFF;
      border-radius: 22px;
      max-width: 620px;
      width: 100%;
      max-height: 86vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 54px rgba(15, 23, 42, 0.28);
    }

    .l612-toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 150;
      background: #0F172A;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 16px;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.28);
      border: 1px solid #334155;
      display: none;
    }

    .l612-toast.show {
      display: block;
      animation: viewFadeIn 0.2s ease-out;
    }

    @media (max-width: 860px) {
      .l612-s1-grid,
      .l612-grid-3,
      .l612-grid-2 {
        grid-template-columns: 1fr;
      }

      .l612-grid-8 {
        grid-template-columns: repeat(2, 1fr);
      }

      .l612-ws-step-tabs {
        grid-template-columns: repeat(2, 1fr);
      }

      .l612-col-5, .l612-col-6, .l612-col-7, .l612-col-8, .l612-col-4 {
        grid-column: span 12;
      }

      .l612-quiz-opts,
      .l612-energy-grid,
      .l612-daily-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .top-bar, .breadcrumb-bar, .study-header-card, .bottom-seq-nav, .l612-no-print,
      #l612ViewMotion, #l612ViewInfographic {
        display: none !important;
      }
      #l612ViewWorksheet {
        display: block !important;
      }
      .l612-ws-panel {
        display: block !important;
        margin-bottom: 16px !important;
      }
      .study-container, .study-body-card {
        max-width: 100% !important;
        padding: 0 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

    function l612PlayChime(freq) {
      if (!l612SoundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!l612AudioCtx) l612AudioCtx = new AudioCtx();
        if (l612AudioCtx.state === "suspended") l612AudioCtx.resume();

        const now = l612AudioCtx.currentTime;
        const osc1 = l612AudioCtx.createOscillator();
        const osc2 = l612AudioCtx.createOscillator();
        const gain = l612AudioCtx.createGain();

        osc1.type = "triangle";
        osc1.frequency.setValueAtTime(freq, now);
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(freq * 1.5, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.11, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.55);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(l612AudioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.58);
        osc2.stop(now + 0.58);
      } catch (e) {}
    }

    function l612StopTTS() {
      l612TtsReqId++;
      l612IsTtsSpeaking = false;
      if ("speechSynthesis" in window) {

    function l612UpdateTtsUI() {
      const btn = document.getElementById("l612TtsToggleBtn");
      const label = document.getElementById("l612TtsLabel");
      const quick = document.getElementById("l612SubtitleTtsQuickBtn");
      const wave = document.getElementById("l612TtsWaveIndicator");
      const prompt = document.getElementById("l612UnmutePromptBtn");

      if (prompt) {
        prompt.style.display = (l612TtsEnabled || l612SoundEnabled) ? "none" : "inline-block";
      }
      if (btn && label && quick) {
        if (l612TtsEnabled) {
          btn.classList.add("active");
          label.textContent = "남자 내레이션 켜짐";
          quick.classList.add("active");
          quick.textContent = "🔊 내레이션 ON";
        } else {
          btn.classList.remove("active");
          label.textContent = "남자 내레이션 켜기";
          quick.classList.remove("active");
          quick.textContent = "🎙️ 음성 듣기";
        }
      }
      if (wave) {
        if (l612TtsEnabled && l612IsTtsSpeaking && l612IsPlaying) {
          wave.classList.add("speaking");
        } else {
          wave.classList.remove("speaking");
        }
      }
    }

    function l612SpeakSegment(segIdx) {
      if (!l612TtsEnabled) return;
      const seg = L612_SEGMENTS[segIdx];
      if (!seg || !("speechSynthesis" in window)) return;

      l612StopTTS();
      const reqId = ++l612TtsReqId;
      try {
        const utter = new SpeechSynthesisUtterance(seg.text);
        utter.lang = "ko-KR";
        const voiceProfiles = {
          Charon: { pitch: 0.86, rate: 0.98 },
          Puck: { pitch: 1.00, rate: 1.05 },
          Orus: { pitch: 0.78, rate: 0.95 }
        };
        const profile = voiceProfiles[l612SelectedVoice] || voiceProfiles.Charon;
        utter.pitch = profile.pitch;
        utter.rate = profile.rate * l612PlaybackSpeed;

        const voices = window.speechSynthesis.getVoices();
        const koVoice = voices.find(function (v) {
          return v.lang.indexOf("ko") !== -1 && /male|남성|hyun|jun|min|inseong/i.test(v.name);
        }) || voices.find(function (v) {
          return v.lang.indexOf("ko") !== -1;
        });
        if (koVoice) utter.voice = koVoice;

        utter.onstart = function () {
          if (reqId === l612TtsReqId) {
            l612IsTtsSpeaking = true;
            l612UpdateTtsUI();
          }
        };
        utter.onend = function () {
          if (reqId === l612TtsReqId) {
            l612IsTtsSpeaking = false;
            l612UpdateTtsUI();
          }
        };
        utter.onerror = function () {
          if (reqId === l612TtsReqId) {
            l612IsTtsSpeaking = false;
            l612UpdateTtsUI();
          }
        };
        window.speechSynthesis.speak(utter);
      } catch (e) {
        l612IsTtsSpeaking = false;
        l612UpdateTtsUI();
      }
    }

    function l612ToggleTTS() {
      l612TtsEnabled = !l612TtsEnabled;
      if (l612TtsEnabled) {
        if (l612CurrentTime >= L612_TOTAL_DURATION) {
          l612CurrentTime = 0;
          l612CurrentSceneIdx = -1;
        }
        if (!l612IsPlaying) {
          l612IsPlaying = true;
          l612LastFrameTime = performance.now();
          l612SyncPlayBtn();
        }
        l612SpeakSegment(l612ActiveSegIdx >= 0 ? l612ActiveSegIdx : 0);
      } else {
        l612StopTTS();
      }
      l612UpdateTtsUI();
    }

    function l612ActivateScene(idx) {
      if (l612CurrentSceneIdx === idx) return;
      l612CurrentSceneIdx = idx;
      const sc = L612_SCENES[idx];
      const stage = document.getElementById("l612MotionStage");
      const badge = document.getElementById("l612SceneBadgeText");
      if (stage) {
        stage.classList.remove("theme-sky", "theme-balance");
        if (sc.themeClass) stage.classList.add(sc.themeClass);
      }
      if (badge) badge.textContent = sc.badge;

      L612_SCENES.forEach(function (item, i) {
        const el = document.getElementById(item.id);
        const btn = document.getElementById("l612ChapBtn" + i);
        if (el) el.classList.toggle("is-active", i === idx);
        if (btn) btn.classList.toggle("active", i === idx);
      });
      l612PlayChime(sc.freq);
    }

    function l612UpdateTimeUI(t) {
      const fill = document.getElementById("l612TimelineFill");
      const tc = document.getElementById("l612TimecodeDisplay");
      const subEl = document.getElementById("l612NarrationSubtitle");
      if (!fill || !tc || !subEl) return;

      const pct = Math.min(100, Math.max(0, (t / L612_TOTAL_DURATION) * 100));
      fill.style.width = pct + "%";
      const s = Math.floor(Math.max(0, t));
      tc.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

      const found = L612_SCENES.find(function (sc) { return t >= sc.start && t < sc.end; }) || L612_SCENES[L612_SCENES.length - 1];
      l612ActivateScene(found.index);

      let matched = L612_SEGMENTS[0];
      for (let i = 0; i < L612_SEGMENTS.length; i++) {
        if (t >= L612_SEGMENTS[i].at) matched = L612_SEGMENTS[i];
      }
      if (subEl.textContent !== matched.text) subEl.textContent = matched.text;
      if (l612ActiveSegIdx !== matched.segIndex) {
        l612ActiveSegIdx = matched.segIndex;
        if (l612TtsEnabled && l612IsPlaying) l612SpeakSegment(matched.segIndex);
      }
    }

    function l612AnimationLoop(ts) {
      if (currentStudySubUnitId !== "6-1-2") {
        l612RafId = null;
        return;
      }
      if (l612LastFrameTime === null) l612LastFrameTime = ts;
      const dt = (ts - l612LastFrameTime) / 1000;
      l612LastFrameTime = ts;

      if (l612MainApp === "motion" && l612IsPlaying) {
        const cur = L612_SEGMENTS[l612ActiveSegIdx];
        const hold = l612TtsEnabled && cur && l612IsTtsSpeaking && (l612CurrentTime + dt * l612PlaybackSpeed >= cur.nextAt - 0.04);
        if (!hold) l612CurrentTime += dt * l612PlaybackSpeed;
        if (l612CurrentTime >= L612_TOTAL_DURATION) {
          l612CurrentTime = L612_TOTAL_DURATION;
          l612IsPlaying = false;
          l612SyncPlayBtn();
          l612UpdateTtsUI();
        }
        l612UpdateTimeUI(l612CurrentTime);
      }
      if (l612MainApp === "motion") l612DrawParticles(dt);
      l612RafId = requestAnimationFrame(l612AnimationLoop);
    }

    function l612SyncPlayBtn() {
      const icon = document.getElementById("l612PlayPauseIcon");
      const text = document.getElementById("l612PlayPauseText");
      if (icon) icon.textContent = l612IsPlaying ? "⏸" : "▶";
      if (text) text.textContent = l612IsPlaying ? "일시정지" : (l612CurrentTime >= L612_TOTAL_DURATION ? "다시 재생" : "재생");
    }

    function l612TogglePlayPause() {
      if (l612CurrentTime >= L612_TOTAL_DURATION) {
        l612CurrentTime = 0;
        l612ActiveSegIdx = -1;
      }
      l612IsPlaying = !l612IsPlaying;
      l612LastFrameTime = performance.now();
      l612SyncPlayBtn();
      if (l612TtsEnabled) {
        if (l612IsPlaying) {
          if ("speechSynthesis" in window && window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          } else if (l612ActiveSegIdx >= 0) {
            l612SpeakSegment(l612ActiveSegIdx);
          }
        } else if ("speechSynthesis" in window && window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
        }
        l612UpdateTtsUI();
      }
    }

    function l612ScrubTimeline(e) {
      const track = document.getElementById("l612TimelineTrack");
      if (!track) return;
      const rect = track.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      l612StopTTS();
      l612CurrentTime = ratio * L612_TOTAL_DURATION;
      l612CurrentSceneIdx = -1;
      l612ActiveSegIdx = -1;
      l612UpdateTimeUI(l612CurrentTime);

    function l612ResizeCanvas() {
      const canvas = document.getElementById("l612ParticleCanvas");
      if (!canvas || !canvas.parentElement) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width || 960;
      canvas.height = rect.height || 500;
    }

    function l612InitParticles() {
      l612Particles = Array.from({ length: 32 }, function () {
        return {
          x: Math.random() * 960,
          y: Math.random() * 500,
          r: 1.5 + Math.random() * 2.8,
          vx: (Math.random() - 0.5) * 16,
          vy: -10 - Math.random() * 18,
          alpha: 0.22 + Math.random() * 0.42
        };
      });
    }

    function l612DrawParticles(dt) {
      const canvas = document.getElementById("l612ParticleCanvas");
      if (!canvas || !canvas.width || !canvas.height) return;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const rgb = l612CurrentSceneIdx === 2 ? "56, 189, 248" : "52, 211, 153";
      l612Particles.forEach(function (p) {
        p.x += p.vx * (dt || 0.016);
        p.y += p.vy * (dt || 0.016);
        if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + rgb + ", " + p.alpha + ")";
        ctx.fill();
      });
    }

    function l612DownloadPng() {
      const svgEl = document.getElementById("l612SummaryInfographicSvg");
      if (!svgEl) return;
      l612ShowToast("노션 이미지 블록용 고화질 PNG 파일을 생성하고 있습니다...");
      try {
        const serializer = new XMLSerializer();
        const svgStr = serializer.serializeToString(svgEl);
        const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          canvas.width = 2400;
          canvas.height = 3300;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);

          const a = document.createElement("a");
          a.download = "2_친환경_에너지의_활용_한장정리.png";
          a.href = canvas.toDataURL("image/png");
          a.click();
          l612ShowToast("PNG 저장 완료! 노션에서 /이미지 블록으로 바로 업로드하세요.");
        };
        img.src = url;
      } catch (e) {
        l612ShowToast("PNG 변환 중 오류가 발생했습니다.");
      }
    }

      { question: "수소와 산소가 화학 반응할 때 발생하는 전기와 물을 이용해 발전·수송에 활용하는 신에너지는?", options: ["석탄 액화 및 가스화", "연료 전지", "소수력 발전", "파력 발전"], answer: 1, explanation: "연료 전지는 수소와 산소의 화학 반응으로 전기와 물을 발생시킵니다." }
    ];

    let l612WsState = {
      activeTab: 1, studentId: "", studentName: "", studyDate: "2026. 11. 15.",
      step1Answer: "", blanks: Array(8).fill(""), blanksGraded: false,

      villageEnergyType: "", villageCaseTitle: "", villageCaseDesc: "",

    function l612WsSwitchTab(tabNum) {
      l612WsState.activeTab = tabNum;
      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById("l612WsTabPanel" + i);
        const btn = document.getElementById("l612WsTabBtn" + i);
        if (panel) panel.classList.toggle("active", i === tabNum);
        if (btn) btn.classList.toggle("active", i === tabNum);
      }

    function l612WsSaveState() {
      try {
        const sId = document.getElementById("l612StudentId");
        const sName = document.getElementById("l612StudentName");
        const sDate = document.getElementById("l612StudyDate");
        const s1 = document.getElementById("l612Step1Answer");
        const vType = document.getElementById("l612VillageEnergyType");
        const vTitle = document.getElementById("l612VillageCaseTitle");
        const vDesc = document.getElementById("l612VillageCaseDesc");
        const vProp = document.getElementById("l612VillageProposalInput");

        if (sId) l612WsState.studentId = sId.value;
        if (sName) l612WsState.studentName = sName.value;
        if (sDate) l612WsState.studyDate = sDate.value;
        if (s1) l612WsState.step1Answer = s1.value;
        if (vType) l612WsState.villageEnergyType = vType.value;
        if (vTitle) l612WsState.villageCaseTitle = vTitle.value;
        if (vDesc) l612WsState.villageCaseDesc = vDesc.value;
        if (vProp) l612WsState.villageProposal = vProp.value;

        localStorage.setItem(L612_WS_STORAGE_KEY, JSON.stringify(l612WsState));
      } catch (e) {}
      l612WsUpdateProgress();
    }

    function l612WsLoadState() {
      try {
        const raw = localStorage.getItem(L612_WS_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          l612WsState = Object.assign({}, l612WsState, parsed);
        }
      } catch (e) {}
    }

      if (box) box.innerHTML = L612_DAILY_INSIGHTS[idx];

    function l612InsertKeyword(kw) {
      const ta = document.getElementById("l612Step1Answer");
      if (!ta) return;
      ta.value = ta.value.trim() ? (ta.value.trim() + ", " + kw) : kw;
      l612HandleStep1Change();

    function l612HandleStep1Change() {

      if (ta && cnt) cnt.textContent = ta.value.length + "자 작성";

    function l612Norm(s) {
      return (s || "").replace(/\s+/g, "").trim();
    }

    function l612RenderWordBank() {
      const box = document.getElementById("l612WordBankContainer");
      if (!box) return;
      const used = new Set(l612WsState.blanks.map(function (b) { return l612Norm(b); }).filter(Boolean));
      box.innerHTML = L612_WORD_BANK.map(function (w) {
        const dis = used.has(l612Norm(w));
        return '<button type="button" class="l612-word-chip' + (dis ? ' used' : '') + '" onclick="l612FillBlank(\'' + w + '\')">' + w + '</button>';
      }).join("");
    }

    function l612SetActiveBlank(idx) {
      l612ActiveBlankIdx = idx;
      document.querySelectorAll("#l612ViewWorksheet .l612-blank-input").forEach(function (el) {
        el.classList.toggle("blank-active", Number(el.getAttribute("data-blank-idx")) === idx);
      });
    }

    function l612BindBlanks() {
      document.querySelectorAll("#l612ViewWorksheet .l612-blank-input").forEach(function (inp) {
        const idx = Number(inp.getAttribute("data-blank-idx"));
        inp.value = l612WsState.blanks[idx] || "";
        inp.addEventListener("focus", function () { l612SetActiveBlank(idx); });
        inp.addEventListener("input", function (e) {
          l612WsState.blanks[idx] = e.target.value;
          l612WsState.blanksGraded = false;
          l612ResetBlankStyles();
          l612RenderWordBank();
          l612WsSaveState();
        });
      });
      l612SetActiveBlank(0);
    }

    function l612FillBlank(word) {
      const idx = l612ActiveBlankIdx;
      l612WsState.blanks[idx] = word;
      l612WsState.blanksGraded = false;
      const inp = document.querySelector('#l612ViewWorksheet .l612-blank-input[data-blank-idx="' + idx + '"]');
      if (inp) inp.value = word;
      l612ResetBlankStyles();
      l612RenderWordBank();
      const next = l612WsState.blanks.findIndex(function (v, i) { return i > idx && !v.trim(); });
      const fb = l612WsState.blanks.findIndex(function (v) { return !v.trim(); });
      if (next !== -1 || fb !== -1) l612SetActiveBlank(next !== -1 ? next : fb);
      l612WsSaveState();
    }

    function l612ResetBlankStyles() {
      const badge = document.getElementById("l612BlankScoreBadge");
      if (badge) badge.style.display = "none";
      document.querySelectorAll("#l612ViewWorksheet .l612-blank-input").forEach(function (inp) {
        inp.classList.remove("correct", "wrong");
      });
    }

    function l612GradeBlanks() {
      let okCount = 0;
      document.querySelectorAll("#l612ViewWorksheet .l612-blank-input").forEach(function (inp) {
        const idx = Number(inp.getAttribute("data-blank-idx"));
        const ok = l612Norm(inp.value) !== "" && l612Norm(inp.value) === l612Norm(L612_BLANK_ANSWERS[idx]);
        inp.classList.remove("correct", "wrong");
        if (ok) {
          okCount++;
          inp.classList.add("correct");
        } else {
          inp.classList.add("wrong");
        }
      });
      l612WsState.blanksGraded = true;
      l612WsSaveState();
      const badge = document.getElementById("l612BlankScoreBadge");
      if (badge) {
        badge.style.display = "inline-block";
        badge.style.background = okCount === 8 ? "#D1FAE5" : "#FEF3C7";
        badge.style.color = okCount === 8 ? "#065F46" : "#92400E";
        badge.textContent = okCount + " / 8개 정답";
      }
    }

    function l612ShowBlankAnswers() {
      document.querySelectorAll("#l612ViewWorksheet .l612-blank-input").forEach(function (inp) {
        const idx = Number(inp.getAttribute("data-blank-idx"));
        l612WsState.blanks[idx] = L612_BLANK_ANSWERS[idx];
        inp.value = L612_BLANK_ANSWERS[idx];
      });
      l612RenderWordBank();
      l612GradeBlanks();
    }

    function l612ClearBlanks() {
      l612WsState.blanks = Array(8).fill("");
      l612WsState.blanksGraded = false;
      document.querySelectorAll("#l612ViewWorksheet .l612-blank-input").forEach(function (inp) { inp.value = ""; });
      l612ResetBlankStyles();
      l612RenderWordBank();
      l612SetActiveBlank(0);
      l612WsSaveState();
    }

    function l612FilterEnergyCards(key) {
      l612WsState.energyFilter = key;
      ["all", "renewable", "new"].forEach(function (k) {
        const btn = document.getElementById("l612FilterBtn-" + k);
        if (!btn) return;
        if (k === key) {
          btn.style.background = "#1E293B";
          btn.style.color = "#FFFFFF";
          btn.style.borderColor = "#1E293B";
        } else {
          btn.style.background = "#F1F5F9";

          btn.style.borderColor = "#CBD5E1";

      const list = L612_ENERGY_DATA.filter(function (item) {

          '<span style="font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;flex-shrink:0;background:' + (done ? '#059669' : '#F1F5F9') + ';color:' + (done ? '#FFFFFF' : '#64748B') + ';">' + (done ? '완료 ✓' : '탐구') + '</span>' +

    function l612InspectEnergy(id) {
      const item = L612_ENERGY_DATA.find(function (e) { return e.id === id; });

      if (!l612WsState.energyExplored[id]) {
        l612WsState.energyExplored[id] = true;

      l612RenderEnergyCards();
      const viewer = document.getElementById("l612EnergyDetailViewer");
      if (viewer) {
        viewer.innerHTML =
          '<div style="font-weight:800;color:#064E3B;margin-bottom:4px;">' + item.icon + ' [' + item.catLabel + '] ' + item.name + ' (' + item.facility + ')</div>' +
          '<p style="font-size:12.5px;color:#334155;line-height:1.55;">' + item.detail + '</p>';

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
